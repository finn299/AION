<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ctaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15302A"/>
      <stop offset="100%" stop-color="#0E1F1B"/>
    </linearGradient>
    <radialGradient id="ctaGold" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#DCC59B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#DCC59B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#ctaBg)"/>
  <rect width="1200" height="400" fill="url(#ctaGold)"/>

  <!-- decorative arches right -->
  <g fill="none" stroke="rgba(220,197,155,0.2)" stroke-width="1">
    <circle cx="1060" cy="200" r="170"/>
    <circle cx="1060" cy="200" r="140" stroke-dasharray="2 8" opacity="0.6"/>
    <circle cx="1060" cy="200" r="110" opacity="0.4"/>
  </g>

  <!-- horizontal hairline -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="rgba(220,197,155,0.12)" stroke-width="0.5"/>

  <!-- monogram watermark -->
  <text x="160" y="290" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="600" font-size="240" fill="#DCC59B" fill-opacity="0.06">A</text>
</svg>
