<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F7F4EC" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCC59B" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#B8945A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#DCC59B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lineGrid" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="100" x2="100" y2="100" stroke="rgba(184,148,90,0.06)" stroke-width="0.6"/>
      <line x1="100" y1="0" x2="100" y2="100" stroke="rgba(184,148,90,0.06)" stroke-width="0.6"/>
    </pattern>
    <pattern id="dotMesh" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.9" fill="rgba(184,148,90,0.22)"/>
    </pattern>
  </defs>

  <!-- Base gradient -->
  <rect width="1600" height="800" fill="url(#lightGrad)"/>
  <!-- Grid + dot mesh overlay -->
  <rect width="1600" height="800" fill="url(#lineGrid)"/>
  <rect width="1600" height="800" fill="url(#dotMesh)"/>

  <!-- Large golden glow upper right -->
  <circle cx="1280" cy="280" r="520" fill="url(#goldGlow)"/>
  <!-- Smaller glow lower left -->
  <circle cx="240" cy="660" r="320" fill="url(#goldGlow)" opacity="0.6"/>

  <!-- Decorative architectural arches right side -->
  <g fill="none" stroke="#B8945A" stroke-width="0.8" opacity="0.35">
    <path d="M 1180 800 L 1180 240 Q 1180 100 1340 100 Q 1500 100 1500 240 L 1500 800" />
    <path d="M 1230 800 L 1230 280 Q 1230 160 1340 160 Q 1450 160 1450 280 L 1450 800" stroke-opacity="0.8"/>
    <path d="M 1280 800 L 1280 320 Q 1280 220 1340 220 Q 1400 220 1400 320 L 1400 800" stroke-opacity="0.6"/>
  </g>

  <!-- Decorative arches left side (smaller) -->
  <g fill="none" stroke="#B8945A" stroke-width="0.6" opacity="0.2">
    <circle cx="160" cy="200" r="120"/>
    <circle cx="160" cy="200" r="90" stroke-dasharray="2 6"/>
    <circle cx="160" cy="200" r="60"/>
  </g>

  <!-- Horizontal accent lines -->
  <g stroke="rgba(184,148,90,0.18)">
    <line x1="0" y1="400" x2="1600" y2="400" stroke-width="0.4"/>
    <line x1="80" y1="120" x2="1100" y2="120" stroke-width="0.3"/>
    <line x1="500" y1="700" x2="1520" y2="700" stroke-width="0.3"/>
  </g>

  <!-- Faint giant monogram A bottom right -->
  <text x="1340" y="780" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="700" font-size="640" fill="#B8945A" fill-opacity="0.07" text-anchor="middle">A</text>

  <!-- Brass accent dots scattered -->
  <g fill="#B8945A">
    <circle cx="80" cy="80" r="3" opacity="0.5"/>
    <circle cx="1520" cy="80" r="3" opacity="0.5"/>
    <circle cx="80" cy="720" r="3" opacity="0.4"/>
    <circle cx="1520" cy="720" r="3" opacity="0.4"/>
    <circle cx="800" cy="60" r="2" opacity="0.3"/>
  </g>
</svg>
