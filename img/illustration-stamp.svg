<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <rect width="480" height="480" fill="#FFFFFF"/>

  <!-- Paper document -->
  <g transform="translate(110 80)">
    <rect width="260" height="340" fill="#F6F6F4" stroke="#DEDDD8" stroke-width="1"/>
    <rect x="-8" y="8" width="260" height="340" fill="#FFFFFF" stroke="#DEDDD8" stroke-width="1"/>

    <!-- Document header -->
    <text x="20" y="40" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="600" font-size="18" fill="#0A0A0A">Certificate of Formation</text>
    <text x="20" y="58" font-family="Inter, sans-serif" font-size="9" letter-spacing="2" font-weight="600" fill="#7A7A75">STATE OF DELAWARE</text>

    <!-- Body lines -->
    <g stroke="#DEDDD8" stroke-width="0.6">
      <line x1="20" y1="86" x2="240" y2="86"/>
      <line x1="20" y1="100" x2="240" y2="100"/>
      <line x1="20" y1="114" x2="220" y2="114"/>
      <line x1="20" y1="138" x2="240" y2="138"/>
      <line x1="20" y1="152" x2="230" y2="152"/>
      <line x1="20" y1="166" x2="240" y2="166"/>
      <line x1="20" y1="180" x2="170" y2="180"/>
      <line x1="20" y1="204" x2="240" y2="204"/>
      <line x1="20" y1="218" x2="200" y2="218"/>
      <line x1="20" y1="232" x2="240" y2="232"/>
    </g>

    <!-- Signature line -->
    <line x1="20" y1="278" x2="160" y2="278" stroke="#0A0A0A" stroke-width="0.8"/>
    <text x="20" y="294" font-family="Inter, sans-serif" font-size="8" letter-spacing="1.5" fill="#7A7A75">AUTHORIZED REPRESENTATIVE</text>

    <!-- Filed badge -->
    <text x="20" y="320" font-family="Inter, sans-serif" font-size="8" letter-spacing="2" font-weight="700" fill="#8E6E36">FILED · MAY 22 2026</text>
  </g>

  <!-- Wax seal stamp -->
  <g transform="translate(340 320)">
    <!-- outer ring -->
    <circle r="56" fill="#B8945A" stroke="#8E6E36" stroke-width="1"/>
    <circle r="52" fill="none" stroke="#0A0A0A" stroke-width="0.6" opacity="0.45"/>
    <circle r="44" fill="none" stroke="#0A0A0A" stroke-width="0.4" opacity="0.45" stroke-dasharray="2 4"/>

    <!-- AION text in seal -->
    <text y="-2" font-family="Inter, sans-serif" font-size="14" letter-spacing="4" font-weight="800" fill="#0A0A0A" text-anchor="middle">AION</text>
    <text y="14" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="11" fill="#0A0A0A" text-anchor="middle">verified</text>
    <text y="32" font-family="Inter, sans-serif" font-size="6" letter-spacing="1.5" fill="#0A0A0A" text-anchor="middle">2026</text>

    <!-- Tiny stars -->
    <g fill="#0A0A0A">
      <circle cx="0" cy="-32" r="1.5"/>
      <circle cx="22" cy="-22" r="1.2"/>
      <circle cx="-22" cy="-22" r="1.2"/>
      <circle cx="32" cy="0" r="1.5"/>
      <circle cx="-32" cy="0" r="1.5"/>
    </g>
  </g>

  <!-- Decorative ornament line on right -->
  <g transform="translate(420 240)" stroke="#B8945A" stroke-width="0.6" fill="none">
    <line x1="0" y1="-100" x2="0" y2="100"/>
    <circle r="3" fill="#B8945A"/>
    <circle cy="-50" r="2" fill="#B8945A"/>
    <circle cy="50" r="2" fill="#B8945A"/>
  </g>
</svg>
