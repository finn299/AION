<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.58  0 0 0 0 0.35  0 0 0 0.18 0"/>
  </filter>
  <rect width="600" height="600" filter="url(#noiseFilter)"/>
</svg>
