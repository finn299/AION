<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 90" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FAFAFA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="hdrGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DCC59B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#DCC59B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdrDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="rgba(184,148,90,0.18)"/>
    </pattern>
  </defs>

  <!-- base gradient -->
  <rect width="1600" height="90" fill="url(#hdrGrad)"/>
  <!-- subtle dot mesh -->
  <rect width="1600" height="90" fill="url(#hdrDots)"/>
  <!-- soft golden glow center -->
  <ellipse cx="800" cy="45" rx="500" ry="60" fill="url(#hdrGold)"/>

  <!-- thin horizontal hairlines -->
  <g stroke="rgba(184,148,90,0.08)">
    <line x1="0" y1="22" x2="1600" y2="22" stroke-width="0.4"/>
    <line x1="0" y1="68" x2="1600" y2="68" stroke-width="0.4"/>
  </g>

  <!-- faint monogram letters scattered -->
  <g font-family="'Cormorant Garamond', serif" font-style="italic" fill="rgba(184,148,90,0.08)">
    <text x="220" y="60" font-size="50">A</text>
    <text x="1380" y="60" font-size="50">N</text>
  </g>

  <!-- gold accent dot far right -->
  <circle cx="1540" cy="45" r="2" fill="rgba(184,148,90,0.3)"/>
  <circle cx="60" cy="45" r="2" fill="rgba(184,148,90,0.3)"/>
</svg>
