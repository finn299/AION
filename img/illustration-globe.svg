<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480">
  <defs>
    <linearGradient id="globeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4137"/>
      <stop offset="100%" stop-color="#0E1F1B"/>
    </linearGradient>
    <radialGradient id="globeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A5648"/>
      <stop offset="100%" stop-color="#0E1F1B"/>
    </radialGradient>
  </defs>
  <rect width="600" height="480" fill="url(#globeBg)"/>

  <!-- Globe -->
  <g transform="translate(300 240)">
    <circle r="160" fill="url(#globeShadow)" stroke="#B8945A" stroke-width="1"/>
    <!-- meridians -->
    <g fill="none" stroke="#B8945A" stroke-width="0.5" opacity="0.5">
      <ellipse cx="0" cy="0" rx="160" ry="60"/>
      <ellipse cx="0" cy="0" rx="160" ry="100"/>
      <ellipse cx="0" cy="0" rx="160" ry="140"/>
      <ellipse cx="0" cy="0" rx="60" ry="160"/>
      <ellipse cx="0" cy="0" rx="100" ry="160"/>
      <ellipse cx="0" cy="0" rx="140" ry="160"/>
    </g>
    <!-- equator highlight -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#DCC59B" stroke-width="0.8" opacity="0.55"/>
    <!-- "service points" -->
    <g fill="#DCC59B">
      <circle cx="-100" cy="-50" r="3"/>
      <circle cx="60" cy="-80" r="3"/>
      <circle cx="40" cy="20" r="3"/>
      <circle cx="-60" cy="70" r="3"/>
      <circle cx="110" cy="40" r="3"/>
      <circle cx="-30" cy="-30" r="3"/>
    </g>
    <!-- connection arcs -->
    <g fill="none" stroke="#B8945A" stroke-width="0.6" opacity="0.6">
      <path d="M -100 -50 Q -30 -110 60 -80"/>
      <path d="M 60 -80 Q 130 -20 110 40"/>
      <path d="M -60 70 Q 0 0 40 20"/>
    </g>
  </g>

  <!-- orbital rings -->
  <g fill="none" stroke="#B8945A" stroke-width="0.4" stroke-dasharray="1 6" opacity="0.4">
    <ellipse cx="300" cy="240" rx="220" ry="80"/>
    <ellipse cx="300" cy="240" rx="240" ry="100"/>
  </g>

  <!-- label -->
  <text x="300" y="430" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" font-size="22" fill="#DCC59B" text-anchor="middle">all 50 states · global filings</text>
</svg>
