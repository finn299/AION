<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F6F4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="#FFFFFF"/>

  <!-- background circles -->
  <g fill="none" stroke="#DEDDD8" stroke-width="0.6" opacity="0.7">
    <circle cx="240" cy="240" r="200"/>
    <circle cx="240" cy="240" r="160" stroke-dasharray="2 8"/>
    <circle cx="240" cy="240" r="120"/>
  </g>

  <!-- Shield body -->
  <g transform="translate(240 240)">
    <path d="M 0 -110 L 90 -80 L 90 30 Q 90 90 0 140 Q -90 90 -90 30 L -90 -80 Z"
          fill="url(#shieldGrad)" stroke="#0A0A0A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Inner detail -->
    <path d="M 0 -85 L 70 -62 L 70 25 Q 70 75 0 115 Q -70 75 -70 25 L -70 -62 Z"
          fill="none" stroke="#B8945A" stroke-width="0.8" opacity="0.6"/>

    <!-- Check mark -->
    <path d="M -35 10 L -8 35 L 40 -20" stroke="#B8945A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- AION wordmark -->
    <text y="-30" font-family="Inter, sans-serif" font-size="11" letter-spacing="3" font-weight="800" fill="#0A0A0A" text-anchor="middle">AION</text>
    <text y="-12" font-family="'Cormorant Garamond', serif" font-style="italic" font-size="9" fill="#8E6E36" text-anchor="middle">verified</text>
  </g>

  <!-- Decorative dots -->
  <g fill="#B8945A">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="400" cy="80" r="2"/>
    <circle cx="80" cy="400" r="2"/>
    <circle cx="400" cy="400" r="2"/>
  </g>
</svg>
